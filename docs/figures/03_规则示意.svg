<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><title>区间判断结合缓冲与连续确认，减少边界反复改判</title><desc>PE TTM 历史分位轴 · 0–100；框线表示边界两侧 5 点缓冲范围</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1,1 L8,5 L1,9" fill="none" stroke="#963749" stroke-width="1.5"/></marker></defs><rect width="1600" height="1000" fill="white"/><g font-family="PingFang SC, Songti SC, sans-serif"><text x="64" y="66" font-size="22" fill="#963749" font-weight="600" text-anchor="start">经纬 · 规则e判</text><text x="64" y="134" font-size="44" fill="#25252b" font-weight="600" text-anchor="start">区间判断结合缓冲与连续确认，减少边界反复改判</text><text x="64" y="184" font-size="25" fill="#666670" font-weight="400" text-anchor="start">PE TTM 历史分位轴 · 0–100；框线表示边界两侧 5 点缓冲范围</text><rect x="100" y="360" width="420" height="110" rx="0" fill="#e3f1e8" stroke="white"/><text x="310.0" y="424" font-size="27" fill="#24694a" font-weight="600" text-anchor="middle">偏低区</text><rect x="520" y="360" width="560" height="110" rx="0" fill="#e7ebf2" stroke="white"/><text x="800.0" y="424" font-size="27" fill="#3f4e66" font-weight="600" text-anchor="middle">中间区</text><rect x="1080" y="360" width="280" height="110" rx="0" fill="#f6ead8" stroke="white"/><text x="1220.0" y="424" font-size="27" fill="#8d5414" font-weight="600" text-anchor="middle">偏高区</text><rect x="1360" y="360" width="140" height="110" rx="0" fill="#f8e2e7" stroke="white"/><text x="1430.0" y="424" font-size="27" fill="#9c2f46" font-weight="600" text-anchor="middle">高位区</text><text x="100" y="515" font-size="26" fill="#25252b" font-weight="500" text-anchor="middle">0</text><text x="520" y="515" font-size="26" fill="#25252b" font-weight="500" text-anchor="middle">30</text><text x="1080" y="515" font-size="26" fill="#25252b" font-weight="500" text-anchor="middle">70</text><text x="1360" y="515" font-size="26" fill="#25252b" font-weight="500" text-anchor="middle">90</text><text x="1500" y="515" font-size="26" fill="#25252b" font-weight="500" text-anchor="middle">100</text><rect x="450" y="335" width="140" height="160" rx="0" fill="none" stroke="#963749"/><text x="520" y="306" font-size="23" fill="#963749" font-weight="500" text-anchor="middle">±5</text><rect x="1010" y="335" width="140" height="160" rx="0" fill="none" stroke="#963749"/><text x="1080" y="306" font-size="23" fill="#963749" font-weight="500" text-anchor="middle">±5</text><rect x="1290" y="335" width="140" height="160" rx="0" fill="none" stroke="#963749"/><text x="1360" y="306" font-size="23" fill="#963749" font-weight="500" text-anchor="middle">±5</text><path d="M783.1999999999999,255 L783.1999999999999,345" fill="none" stroke="#963749" stroke-width="3" marker-end="url(#arrow)"/><text x="783.1999999999999" y="244" font-size="29" fill="#963749" font-weight="600" text-anchor="middle">沪深300 · 48.8 分位</text><text x="100" y="572" font-size="28" fill="#25252b" font-weight="600" text-anchor="start">边界附近先等待：离开已确认区间，需再越过 5 个百分点</text><rect x="100" y="615" width="670" height="180" rx="16" fill="white" stroke="#dedde2"/><text x="124" y="660" font-size="29" fill="#25252b" font-weight="600" text-anchor="start">以 70 边界为例</text><text x="124" y="706" font-size="23" fill="#666670" font-weight="400" text-anchor="start">中间区 → 偏高区：达到 75 分位</text><text x="124" y="745" font-size="23" fill="#666670" font-weight="400" text-anchor="start">偏高区 → 中间区：低于 65 分位</text><rect x="810" y="615" width="690" height="180" rx="16" fill="white" stroke="#dedde2"/><text x="834" y="660" font-size="29" fill="#25252b" font-weight="600" text-anchor="start">越过门槛后，还需连续确认</text><text x="834" y="706" font-size="23" fill="#666670" font-weight="400" text-anchor="start">中证日频：连续 5 个交易日</text><text x="834" y="745" font-size="23" fill="#666670" font-weight="400" text-anchor="start">蛋卷周频：连续 2 个周读数</text><text x="100" y="850" font-size="24" fill="#666670" font-weight="400" text-anchor="start">分位窗口：近 10 年；不足 10 年使用已有历史，至少 5 年。</text><path d="M64,915 H1536" stroke="#dedde2"/><text x="64" y="956" font-size="21" fill="#666670" font-weight="400" text-anchor="start">沪深300：中证指数官网每日估值；数据截至 2026-09-30。</text></g></svg>