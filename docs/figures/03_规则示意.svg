<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1200" viewBox="0 200 1600 800">
  <title>区间判断结合缓冲与连续确认，减少边界反复改判</title>
  <desc>PE TTM 历史分位轴 · 0–100；框线表示边界两侧 5 点缓冲范围</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1,1 L8,5 L1,9" fill="none" stroke="#262626" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="1600" height="1000" fill="white"/>
  <g font-family="SimSun">
    <rect x="100" y="360" width="420" height="110" rx="0.0" fill="white" stroke="#262626" stroke-width="1.5"/>
    <text x="310.0" y="424" font-size="27" fill="#262626" font-weight="400" text-anchor="middle" font-family="SimHei"><tspan font-family="SimHei">偏低区</tspan></text>
    <rect x="520" y="360" width="560" height="110" rx="0.0" fill="white" stroke="#262626" stroke-width="1.5"/>
    <text x="800.0" y="424" font-size="27" fill="#262626" font-weight="400" text-anchor="middle" font-family="SimHei"><tspan font-family="SimHei">中间区</tspan></text>
    <rect x="1080" y="360" width="280" height="110" rx="0.0" fill="white" stroke="#262626" stroke-width="1.5"/>
    <text x="1220.0" y="424" font-size="27" fill="#262626" font-weight="400" text-anchor="middle" font-family="SimHei"><tspan font-family="SimHei">偏高区</tspan></text>
    <rect x="1360" y="360" width="140" height="110" rx="0.0" fill="white" stroke="#262626" stroke-width="1.5"/>
    <text x="1430.0" y="424" font-size="27" fill="#262626" font-weight="400" text-anchor="middle" font-family="SimHei"><tspan font-family="SimHei">高位区</tspan></text>
    <text x="100" y="515" font-size="26" fill="#262626" font-weight="400" text-anchor="middle" font-family="SimSun"><tspan font-family="Times New Roman">0</tspan></text>
    <text x="520" y="515" font-size="26" fill="#262626" font-weight="400" text-anchor="middle" font-family="SimSun"><tspan font-family="Times New Roman">30</tspan></text>
    <text x="1080" y="515" font-size="26" fill="#262626" font-weight="400" text-anchor="middle" font-family="SimSun"><tspan font-family="Times New Roman">70</tspan></text>
    <text x="1360" y="515" font-size="26" fill="#262626" font-weight="400" text-anchor="middle" font-family="SimSun"><tspan font-family="Times New Roman">90</tspan></text>
    <text x="1500" y="515" font-size="26" fill="#262626" font-weight="400" text-anchor="middle" font-family="SimSun"><tspan font-family="Times New Roman">100</tspan></text>
    <rect x="450" y="335" width="140" height="160" rx="0.0" fill="none" stroke="#262626" stroke-width="1.5"/>
    <text x="520" y="306" font-size="23" fill="#262626" font-weight="400" text-anchor="middle" font-family="SimSun"><tspan font-family="SimSun">±</tspan><tspan font-family="Times New Roman">5</tspan></text>
    <rect x="1010" y="335" width="140" height="160" rx="0.0" fill="none" stroke="#262626" stroke-width="1.5"/>
    <text x="1080" y="306" font-size="23" fill="#262626" font-weight="400" text-anchor="middle" font-family="SimSun"><tspan font-family="SimSun">±</tspan><tspan font-family="Times New Roman">5</tspan></text>
    <rect x="1290" y="335" width="140" height="160" rx="0.0" fill="none" stroke="#262626" stroke-width="1.5"/>
    <text x="1360" y="306" font-size="23" fill="#262626" font-weight="400" text-anchor="middle" font-family="SimSun"><tspan font-family="SimSun">±</tspan><tspan font-family="Times New Roman">5</tspan></text>
    <path d="M783.1999999999999,255 L783.1999999999999,345" fill="none" stroke="#262626" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="783.1999999999999" y="244" font-size="29" fill="#262626" font-weight="400" text-anchor="middle" font-family="SimHei"><tspan font-family="SimHei">沪深</tspan><tspan font-family="Times New Roman">300 </tspan><tspan font-family="SimHei">·</tspan><tspan font-family="Times New Roman"> 48.8 </tspan><tspan font-family="SimHei">分位</tspan></text>
    <text x="100" y="572" font-size="28" fill="#262626" font-weight="400" text-anchor="start" font-family="SimHei"><tspan font-family="SimHei">边界附近先等待：离开已确认区间，需再越过</tspan><tspan font-family="Times New Roman"> 5 </tspan><tspan font-family="SimHei">个百分点</tspan></text>
    <rect x="100" y="615" width="670" height="180" rx="4" fill="white" stroke="#262626" stroke-width="1.5"/>
    <text x="124" y="660" font-size="29" fill="#262626" font-weight="400" text-anchor="start" font-family="SimHei"><tspan font-family="SimHei">以</tspan><tspan font-family="Times New Roman"> 70 </tspan><tspan font-family="SimHei">边界为例</tspan></text>
    <text x="124" y="706" font-size="23" fill="#262626" font-weight="400" text-anchor="start" font-family="SimSun"><tspan font-family="SimSun">中间区</tspan><tspan font-family="Times New Roman"> </tspan><tspan font-family="SimSun">→</tspan><tspan font-family="Times New Roman"> </tspan><tspan font-family="SimSun">偏高区：达到</tspan><tspan font-family="Times New Roman"> 75 </tspan><tspan font-family="SimSun">分位</tspan></text>
    <text x="124" y="745" font-size="23" fill="#262626" font-weight="400" text-anchor="start" font-family="SimSun"><tspan font-family="SimSun">偏高区</tspan><tspan font-family="Times New Roman"> </tspan><tspan font-family="SimSun">→</tspan><tspan font-family="Times New Roman"> </tspan><tspan font-family="SimSun">中间区：低于</tspan><tspan font-family="Times New Roman"> 65 </tspan><tspan font-family="SimSun">分位</tspan></text>
    <rect x="810" y="615" width="690" height="180" rx="4" fill="white" stroke="#262626" stroke-width="1.5"/>
    <text x="834" y="660" font-size="29" fill="#262626" font-weight="400" text-anchor="start" font-family="SimHei"><tspan font-family="SimHei">越过门槛后，还需连续确认</tspan></text>
    <text x="834" y="706" font-size="23" fill="#262626" font-weight="400" text-anchor="start" font-family="SimSun"><tspan font-family="SimSun">中证日频：连续</tspan><tspan font-family="Times New Roman"> 5 </tspan><tspan font-family="SimSun">个交易日</tspan></text>
    <text x="834" y="745" font-size="23" fill="#262626" font-weight="400" text-anchor="start" font-family="SimSun"><tspan font-family="SimSun">蛋卷周频：连续</tspan><tspan font-family="Times New Roman"> 2 </tspan><tspan font-family="SimSun">个周读数</tspan></text>
    <text x="100" y="850" font-size="24" fill="#262626" font-weight="400" text-anchor="start" font-family="SimSun"><tspan font-family="SimSun">分位窗口：近</tspan><tspan font-family="Times New Roman"> 10 </tspan><tspan font-family="SimSun">年；不足</tspan><tspan font-family="Times New Roman"> 10 </tspan><tspan font-family="SimSun">年使用已有历史，至少</tspan><tspan font-family="Times New Roman"> 5 </tspan><tspan font-family="SimSun">年。</tspan></text>
    <path d="M64,915 H1536" stroke="#262626" stroke-width="1.5"/>
    <text x="64" y="956" font-size="21" fill="#262626" font-weight="400" text-anchor="start" font-family="SimSun"><tspan font-family="SimSun">沪深</tspan><tspan font-family="Times New Roman">300</tspan><tspan font-family="SimSun">：中证指数官网每日估值；数据截至</tspan><tspan font-family="Times New Roman"> 2026-09-30</tspan><tspan font-family="SimSun">。</tspan></text>
  </g>
</svg>