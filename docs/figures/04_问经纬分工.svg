<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1200" viewBox="0 200 1600 800">
  <title>规则负责判别，大模型负责解释，生成内容经过校验</title>
  <desc>问题 → 规则取证 → 大模型生成 → 校验 → 显示结果</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1,1 L8,5 L1,9" fill="none" stroke="#262626" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="1600" height="1000" fill="white"/>
  <g font-family="SimSun">
    <rect x="64" y="310" width="270" height="190" rx="4" fill="white" stroke="#262626" stroke-width="1.5"/>
    <text x="88" y="355" font-size="29" fill="#262626" font-weight="400" text-anchor="start" font-family="SimHei"><tspan font-family="Times New Roman">01 </tspan><tspan font-family="SimHei">用户问题</tspan></text>
    <text x="88" y="401" font-size="23" fill="#262626" font-weight="400" text-anchor="start" font-family="SimSun"><tspan font-family="SimSun">围绕判断与持仓提问</tspan></text>
    <rect x="404" y="310" width="300" height="190" rx="4" fill="white" stroke="#262626" stroke-width="1.5"/>
    <text x="428" y="355" font-size="29" fill="#262626" font-weight="400" text-anchor="start" font-family="SimHei"><tspan font-family="Times New Roman">02 </tspan><tspan font-family="SimHei">取证</tspan></text>
    <text x="428" y="401" font-size="23" fill="#262626" font-weight="400" text-anchor="start" font-family="SimSun"><tspan font-family="SimSun">提取相关规则片段</tspan></text>
    <text x="428" y="440" font-size="23" fill="#262626" font-weight="400" text-anchor="start" font-family="SimSun"><tspan font-family="SimSun">保留指数、日期与来源</tspan></text>
    <rect x="774" y="310" width="340" height="190" rx="4" fill="white" stroke="#262626" stroke-width="1.5"/>
    <text x="798" y="355" font-size="29" fill="#262626" font-weight="400" text-anchor="start" font-family="SimHei"><tspan font-family="Times New Roman">03 </tspan><tspan font-family="SimHei">大模型生成</tspan></text>
    <text x="798" y="401" font-size="23" fill="#262626" font-weight="400" text-anchor="start" font-family="SimSun"><tspan font-family="SimSun">依据规则证据解释</tspan></text>
    <text x="798" y="440" font-size="23" fill="#262626" font-weight="400" text-anchor="start" font-family="SimSun"><tspan font-family="SimSun">规则负责判断立场</tspan></text>
    <rect x="1184" y="310" width="352" height="190" rx="4" fill="white" stroke="#262626" stroke-width="1.5"/>
    <text x="1208" y="355" font-size="29" fill="#262626" font-weight="400" text-anchor="start" font-family="SimHei"><tspan font-family="Times New Roman">04 </tspan><tspan font-family="SimHei">校验</tspan></text>
    <text x="1208" y="401" font-size="23" fill="#262626" font-weight="400" text-anchor="start" font-family="SimSun"><tspan font-family="SimSun">逐项核对生成内容</tspan></text>
    <path d="M344,405 L390,405" fill="none" stroke="#262626" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M714,405 L760,405" fill="none" stroke="#262626" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M1124,405 L1170,405" fill="none" stroke="#262626" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="64" y="620" width="740" height="215" rx="4" fill="white" stroke="#262626" stroke-width="1.5"/>
    <text x="88" y="665" font-size="29" fill="#262626" font-weight="400" text-anchor="start" font-family="SimHei"><tspan font-family="SimHei">校验范围</tspan></text>
    <text x="88" y="711" font-size="23" fill="#262626" font-weight="400" text-anchor="start" font-family="SimSun"><tspan font-family="SimSun">立场</tspan><tspan font-family="Times New Roman"> </tspan><tspan font-family="SimSun">·</tspan><tspan font-family="Times New Roman"> </tspan><tspan font-family="SimSun">数字</tspan><tspan font-family="Times New Roman"> </tspan><tspan font-family="SimSun">·</tspan><tspan font-family="Times New Roman"> </tspan><tspan font-family="SimSun">日期</tspan><tspan font-family="Times New Roman"> </tspan><tspan font-family="SimSun">·</tspan><tspan font-family="Times New Roman"> </tspan><tspan font-family="SimSun">指数</tspan></text>
    <text x="88" y="750" font-size="23" fill="#262626" font-weight="400" text-anchor="start" font-family="SimSun"><tspan font-family="SimSun">来源</tspan><tspan font-family="Times New Roman"> </tspan><tspan font-family="SimSun">·</tspan><tspan font-family="Times New Roman"> </tspan><tspan font-family="SimSun">确认长度</tspan><tspan font-family="Times New Roman"> </tspan><tspan font-family="SimSun">·</tspan><tspan font-family="Times New Roman"> </tspan><tspan font-family="SimSun">预测用语</tspan></text>
    <path d="M1360,515 V550 M1034,605 V550 H1385 V605" fill="none" stroke="#262626" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="884" y="620" width="300" height="215" rx="4" fill="white" stroke="#262626" stroke-width="1.5"/>
    <text x="908" y="665" font-size="29" fill="#262626" font-weight="400" text-anchor="start" font-family="SimHei"><tspan font-family="SimHei">通过</tspan></text>
    <text x="908" y="711" font-size="23" fill="#262626" font-weight="400" text-anchor="start" font-family="SimSun"><tspan font-family="SimSun">显示解读</tspan></text>
    <text x="908" y="750" font-size="23" fill="#262626" font-weight="400" text-anchor="start" font-family="SimSun"><tspan font-family="SimSun">附规则证据</tspan></text>
    <rect x="1234" y="620" width="302" height="215" rx="4" fill="white" stroke="#262626" stroke-width="1.5"/>
    <text x="1258" y="665" font-size="29" fill="#262626" font-weight="400" text-anchor="start" font-family="SimHei"><tspan font-family="SimHei">不通过</tspan></text>
    <text x="1258" y="711" font-size="23" fill="#262626" font-weight="400" text-anchor="start" font-family="SimSun"><tspan font-family="SimSun">只给规则原文</tspan></text>
    <text x="64" y="874" font-size="27" fill="#262626" font-weight="400" text-anchor="start" font-family="SimHei"><tspan font-family="SimHei">规则判别给出结论，大模型帮助用户理解结论与依据。</tspan></text>
    <path d="M64,915 H1536" stroke="#262626" stroke-width="1.5"/>
    <text x="64" y="956" font-size="21" fill="#262626" font-weight="400" text-anchor="start" font-family="SimSun"><tspan font-family="SimSun">生成内容通过校验后显示；不通过时保留可核对的规则原文。</tspan></text>
  </g>
</svg>