<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><title>规则负责判别，大模型负责解释，生成内容经过校验</title><desc>问题 → 规则取证 → 大模型生成 → 校验 → 显示结果</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1,1 L8,5 L1,9" fill="none" stroke="#963749" stroke-width="1.5"/></marker></defs><rect width="1600" height="1000" fill="white"/><g font-family="PingFang SC, Songti SC, sans-serif"><text x="64" y="66" font-size="22" fill="#963749" font-weight="600" text-anchor="start">经纬 · 规则e判</text><text x="64" y="134" font-size="44" fill="#25252b" font-weight="600" text-anchor="start">规则负责判别，大模型负责解释，生成内容经过校验</text><text x="64" y="184" font-size="25" fill="#666670" font-weight="400" text-anchor="start">问题 → 规则取证 → 大模型生成 → 校验 → 显示结果</text><rect x="64" y="310" width="270" height="190" rx="16" fill="white" stroke="#dedde2"/><text x="88" y="355" font-size="29" fill="#25252b" font-weight="600" text-anchor="start">01 用户问题</text><text x="88" y="401" font-size="23" fill="#666670" font-weight="400" text-anchor="start">围绕判断与持仓提问</text><rect x="404" y="310" width="300" height="190" rx="16" fill="white" stroke="#dedde2"/><text x="428" y="355" font-size="29" fill="#25252b" font-weight="600" text-anchor="start">02 取证</text><text x="428" y="401" font-size="23" fill="#666670" font-weight="400" text-anchor="start">提取相关规则片段</text><text x="428" y="440" font-size="23" fill="#666670" font-weight="400" text-anchor="start">保留指数、日期与来源</text><rect x="774" y="310" width="340" height="190" rx="16" fill="white" stroke="#dedde2"/><text x="798" y="355" font-size="29" fill="#25252b" font-weight="600" text-anchor="start">03 大模型生成</text><text x="798" y="401" font-size="23" fill="#666670" font-weight="400" text-anchor="start">依据规则证据解释</text><text x="798" y="440" font-size="23" fill="#666670" font-weight="400" text-anchor="start">规则负责判断立场</text><rect x="1184" y="310" width="352" height="190" rx="16" fill="white" stroke="#dedde2"/><text x="1208" y="355" font-size="29" fill="#25252b" font-weight="600" text-anchor="start">04 校验</text><text x="1208" y="401" font-size="23" fill="#666670" font-weight="400" text-anchor="start">逐项核对生成内容</text><path d="M344,405 L390,405" fill="none" stroke="#963749" stroke-width="3" marker-end="url(#arrow)"/><path d="M714,405 L760,405" fill="none" stroke="#963749" stroke-width="3" marker-end="url(#arrow)"/><path d="M1124,405 L1170,405" fill="none" stroke="#963749" stroke-width="3" marker-end="url(#arrow)"/><rect x="64" y="620" width="740" height="215" rx="16" fill="white" stroke="#dedde2"/><text x="88" y="665" font-size="29" fill="#25252b" font-weight="600" text-anchor="start">校验范围</text><text x="88" y="711" font-size="23" fill="#666670" font-weight="400" text-anchor="start">立场 · 数字 · 日期 · 指数</text><text x="88" y="750" font-size="23" fill="#666670" font-weight="400" text-anchor="start">来源 · 确认长度 · 预测用语</text><path d="M1360,515 V550 M1034,605 V550 H1385 V605" fill="none" stroke="#963749" stroke-width="3" marker-end="url(#arrow)"/><rect x="884" y="620" width="300" height="215" rx="16" fill="#e3f1e8" stroke="#dedde2"/><text x="908" y="665" font-size="29" fill="#25252b" font-weight="600" text-anchor="start">通过</text><text x="908" y="711" font-size="23" fill="#666670" font-weight="400" text-anchor="start">显示解读</text><text x="908" y="750" font-size="23" fill="#666670" font-weight="400" text-anchor="start">附规则证据</text><rect x="1234" y="620" width="302" height="215" rx="16" fill="#f8e2e7" stroke="#dedde2"/><text x="1258" y="665" font-size="29" fill="#25252b" font-weight="600" text-anchor="start">不通过</text><text x="1258" y="711" font-size="23" fill="#666670" font-weight="400" text-anchor="start">只给规则原文</text><text x="64" y="874" font-size="27" fill="#25252b" font-weight="600" text-anchor="start">规则判别给出结论，大模型帮助用户理解结论与依据。</text><path d="M64,915 H1536" stroke="#dedde2"/><text x="64" y="956" font-size="21" fill="#666670" font-weight="400" text-anchor="start">生成内容通过校验后显示；不通过时保留可核对的规则原文。</text></g></svg>