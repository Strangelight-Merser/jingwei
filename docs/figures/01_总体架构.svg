<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850"><title>公开数据经规则判别，形成可解释的决策服务</title><desc>数据 → 规则 → 服务 → 渠道</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1,1 L8,5 L1,9" fill="none" stroke="#963749" stroke-width="1.5"/></marker></defs><rect width="1600" height="850" fill="white"/><g font-family="PingFang SC, Songti SC, sans-serif"><text x="64" y="66" font-size="22" fill="#963749" font-weight="600" text-anchor="start">经纬 · 规则e判</text><text x="64" y="134" font-size="44" fill="#25252b" font-weight="600" text-anchor="start">公开数据经规则判别，形成可解释的决策服务</text><text x="64" y="184" font-size="25" fill="#666670" font-weight="400" text-anchor="start">数据 → 规则 → 服务 → 渠道</text><text x="64" y="266" font-size="28" fill="#963749" font-weight="600" text-anchor="start">01 数据层</text><text x="446" y="266" font-size="28" fill="#963749" font-weight="600" text-anchor="start">02 规则层</text><text x="828" y="266" font-size="28" fill="#963749" font-weight="600" text-anchor="start">03 服务层</text><text x="1210" y="266" font-size="28" fill="#963749" font-weight="600" text-anchor="start">04 渠道</text><rect x="64" y="300" width="330" height="370" rx="16" fill="white" stroke="#dedde2"/><text x="88" y="345" font-size="29" fill="#25252b" font-weight="600" text-anchor="start">公开数据</text><text x="88" y="391" font-size="23" fill="#666670" font-weight="400" text-anchor="start">中证官网日估值 · 6 指数</text><text x="88" y="430" font-size="23" fill="#666670" font-weight="400" text-anchor="start">蛋卷周估值 · 5 指数</text><text x="88" y="469" font-size="23" fill="#666670" font-weight="400" text-anchor="start">中证全收益 · 5 指数</text><text x="88" y="508" font-size="23" fill="#666670" font-weight="400" text-anchor="start">中债十年国债收益率</text><rect x="446" y="300" width="330" height="370" rx="16" fill="white" stroke="#dedde2"/><text x="470" y="345" font-size="29" fill="#25252b" font-weight="600" text-anchor="start">统一规则</text><text x="470" y="391" font-size="23" fill="#666670" font-weight="400" text-anchor="start">PE TTM 近 10 年分位</text><text x="470" y="430" font-size="23" fill="#666670" font-weight="400" text-anchor="start">四区间 · 30 / 70 / 90</text><text x="470" y="469" font-size="23" fill="#666670" font-weight="400" text-anchor="start">离开原区间 · 5 点缓冲</text><text x="470" y="508" font-size="23" fill="#666670" font-weight="400" text-anchor="start">日频 5 日 / 周频 2 次确认</text><rect x="828" y="300" width="330" height="370" rx="16" fill="white" stroke="#dedde2"/><text x="852" y="345" font-size="29" fill="#25252b" font-weight="600" text-anchor="start">决策服务</text><text x="852" y="391" font-size="23" fill="#666670" font-weight="400" text-anchor="start">今日判断</text><text x="852" y="430" font-size="23" fill="#666670" font-weight="400" text-anchor="start">改判记录与收益回放</text><text x="852" y="469" font-size="23" fill="#666670" font-weight="400" text-anchor="start">持仓体检</text><text x="852" y="508" font-size="23" fill="#666670" font-weight="400" text-anchor="start">问经纬</text><text x="852" y="547" font-size="23" fill="#666670" font-weight="400" text-anchor="start">规则判别 + 大模型解读</text><text x="852" y="586" font-size="23" fill="#666670" font-weight="400" text-anchor="start">机构服务规则卡 / JSON</text><text x="852" y="625" font-size="23" fill="#666670" font-weight="400" text-anchor="start">客户经理说明</text><rect x="1210" y="300" width="326" height="370" rx="16" fill="white" stroke="#dedde2"/><text x="1234" y="345" font-size="29" fill="#25252b" font-weight="600" text-anchor="start">服务入口</text><text x="1234" y="391" font-size="23" fill="#666670" font-weight="400" text-anchor="start">工银手机银行基金频道</text><text x="1234" y="430" font-size="23" fill="#666670" font-weight="400" text-anchor="start">客户经理</text><text x="1234" y="469" font-size="23" fill="#666670" font-weight="400" text-anchor="start">桌面 / 网页</text><path d="M400,480 L438,480" fill="none" stroke="#963749" stroke-width="3" marker-end="url(#arrow)"/><path d="M782,480 L820,480" fill="none" stroke="#963749" stroke-width="3" marker-end="url(#arrow)"/><path d="M1164,480 L1202,480" fill="none" stroke="#963749" stroke-width="3" marker-end="url(#arrow)"/><text x="64" y="737" font-size="29" fill="#25252b" font-weight="600" text-anchor="start">估值判断覆盖 11 个指数</text><text x="64" y="785" font-size="25" fill="#666670" font-weight="400" text-anchor="start">收益回放与股债对照覆盖 5 个指数</text><text x="1210" y="740" font-size="23" fill="#963749" font-weight="400" text-anchor="start">工行渠道为拟落地场景</text><text x="1210" y="780" font-size="23" fill="#666670" font-weight="400" text-anchor="start">桌面 / 网页已实现</text></g></svg>