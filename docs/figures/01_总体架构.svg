<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="975" viewBox="0 200 1600 650">
  <title>公开数据经规则判别，形成可解释的决策服务</title>
  <desc>数据 → 规则 → 服务 → 渠道</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1,1 L8,5 L1,9" fill="none" stroke="#262626" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="1600" height="850" fill="white"/>
  <g font-family="SimSun">
    <text x="64" y="266" font-size="28" fill="#262626" font-weight="400" text-anchor="start" font-family="SimHei"><tspan font-family="Times New Roman">01 </tspan><tspan font-family="SimHei">数据层</tspan></text>
    <text x="446" y="266" font-size="28" fill="#262626" font-weight="400" text-anchor="start" font-family="SimHei"><tspan font-family="Times New Roman">02 </tspan><tspan font-family="SimHei">规则层</tspan></text>
    <text x="828" y="266" font-size="28" fill="#262626" font-weight="400" text-anchor="start" font-family="SimHei"><tspan font-family="Times New Roman">03 </tspan><tspan font-family="SimHei">服务层</tspan></text>
    <text x="1210" y="266" font-size="28" fill="#262626" font-weight="400" text-anchor="start" font-family="SimHei"><tspan font-family="Times New Roman">04 </tspan><tspan font-family="SimHei">渠道</tspan></text>
    <rect x="64" y="300" width="330" height="370" rx="4" fill="white" stroke="#262626" stroke-width="1.5"/>
    <text x="88" y="345" font-size="29" fill="#262626" font-weight="400" text-anchor="start" font-family="SimHei"><tspan font-family="SimHei">公开数据</tspan></text>
    <text x="88" y="391" font-size="23" fill="#262626" font-weight="400" text-anchor="start" font-family="SimSun"><tspan font-family="SimSun">中证官网日估值</tspan><tspan font-family="Times New Roman"> </tspan><tspan font-family="SimSun">·</tspan><tspan font-family="Times New Roman"> 6 </tspan><tspan font-family="SimSun">指数</tspan></text>
    <text x="88" y="430" font-size="23" fill="#262626" font-weight="400" text-anchor="start" font-family="SimSun"><tspan font-family="SimSun">蛋卷周估值</tspan><tspan font-family="Times New Roman"> </tspan><tspan font-family="SimSun">·</tspan><tspan font-family="Times New Roman"> 5 </tspan><tspan font-family="SimSun">指数</tspan></text>
    <text x="88" y="469" font-size="23" fill="#262626" font-weight="400" text-anchor="start" font-family="SimSun"><tspan font-family="SimSun">中证全收益</tspan><tspan font-family="Times New Roman"> </tspan><tspan font-family="SimSun">·</tspan><tspan font-family="Times New Roman"> 5 </tspan><tspan font-family="SimSun">指数</tspan></text>
    <text x="88" y="508" font-size="23" fill="#262626" font-weight="400" text-anchor="start" font-family="SimSun"><tspan font-family="SimSun">中债十年国债收益率</tspan></text>
    <rect x="446" y="300" width="330" height="370" rx="4" fill="white" stroke="#262626" stroke-width="1.5"/>
    <text x="470" y="345" font-size="29" fill="#262626" font-weight="400" text-anchor="start" font-family="SimHei"><tspan font-family="SimHei">统一规则</tspan></text>
    <text x="470" y="391" font-size="23" fill="#262626" font-weight="400" text-anchor="start" font-family="SimSun"><tspan font-family="Times New Roman">PE TTM </tspan><tspan font-family="SimSun">近</tspan><tspan font-family="Times New Roman"> 10 </tspan><tspan font-family="SimSun">年分位</tspan></text>
    <text x="470" y="430" font-size="23" fill="#262626" font-weight="400" text-anchor="start" font-family="SimSun"><tspan font-family="SimSun">四区间</tspan><tspan font-family="Times New Roman"> </tspan><tspan font-family="SimSun">·</tspan><tspan font-family="Times New Roman"> 30 / 70 / 90</tspan></text>
    <text x="470" y="469" font-size="23" fill="#262626" font-weight="400" text-anchor="start" font-family="SimSun"><tspan font-family="SimSun">离开原区间</tspan><tspan font-family="Times New Roman"> </tspan><tspan font-family="SimSun">·</tspan><tspan font-family="Times New Roman"> 5 </tspan><tspan font-family="SimSun">点缓冲</tspan></text>
    <text x="470" y="508" font-size="23" fill="#262626" font-weight="400" text-anchor="start" font-family="SimSun"><tspan font-family="SimSun">日频</tspan><tspan font-family="Times New Roman"> 5 </tspan><tspan font-family="SimSun">日</tspan><tspan font-family="Times New Roman"> / </tspan><tspan font-family="SimSun">周频</tspan><tspan font-family="Times New Roman"> 2 </tspan><tspan font-family="SimSun">次确认</tspan></text>
    <rect x="828" y="300" width="330" height="370" rx="4" fill="white" stroke="#262626" stroke-width="1.5"/>
    <text x="852" y="345" font-size="29" fill="#262626" font-weight="400" text-anchor="start" font-family="SimHei"><tspan font-family="SimHei">决策服务</tspan></text>
    <text x="852" y="391" font-size="23" fill="#262626" font-weight="400" text-anchor="start" font-family="SimSun"><tspan font-family="SimSun">今日判断</tspan></text>
    <text x="852" y="430" font-size="23" fill="#262626" font-weight="400" text-anchor="start" font-family="SimSun"><tspan font-family="SimSun">改判记录与收益回放</tspan></text>
    <text x="852" y="469" font-size="23" fill="#262626" font-weight="400" text-anchor="start" font-family="SimSun"><tspan font-family="SimSun">持仓体检</tspan></text>
    <text x="852" y="508" font-size="23" fill="#262626" font-weight="400" text-anchor="start" font-family="SimSun"><tspan font-family="SimSun">问经纬</tspan></text>
    <text x="852" y="547" font-size="23" fill="#262626" font-weight="400" text-anchor="start" font-family="SimSun"><tspan font-family="SimSun">规则判别</tspan><tspan font-family="Times New Roman"> + </tspan><tspan font-family="SimSun">大模型解读</tspan></text>
    <text x="852" y="586" font-size="23" fill="#262626" font-weight="400" text-anchor="start" font-family="SimSun"><tspan font-family="SimSun">机构服务规则卡</tspan><tspan font-family="Times New Roman"> / JSON</tspan></text>
    <text x="852" y="625" font-size="23" fill="#262626" font-weight="400" text-anchor="start" font-family="SimSun"><tspan font-family="SimSun">客户经理说明</tspan></text>
    <rect x="1210" y="300" width="326" height="370" rx="4" fill="white" stroke="#262626" stroke-width="1.5"/>
    <text x="1234" y="345" font-size="29" fill="#262626" font-weight="400" text-anchor="start" font-family="SimHei"><tspan font-family="SimHei">服务入口</tspan></text>
    <text x="1234" y="391" font-size="23" fill="#262626" font-weight="400" text-anchor="start" font-family="SimSun"><tspan font-family="SimSun">工银手机银行基金频道</tspan></text>
    <text x="1234" y="430" font-size="23" fill="#262626" font-weight="400" text-anchor="start" font-family="SimSun"><tspan font-family="SimSun">客户经理</tspan></text>
    <text x="1234" y="469" font-size="23" fill="#262626" font-weight="400" text-anchor="start" font-family="SimSun"><tspan font-family="SimSun">桌面</tspan><tspan font-family="Times New Roman"> / </tspan><tspan font-family="SimSun">网页</tspan></text>
    <path d="M400,480 L438,480" fill="none" stroke="#262626" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M782,480 L820,480" fill="none" stroke="#262626" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M1164,480 L1202,480" fill="none" stroke="#262626" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="64" y="737" font-size="29" fill="#262626" font-weight="400" text-anchor="start" font-family="SimHei"><tspan font-family="SimHei">估值判断覆盖</tspan><tspan font-family="Times New Roman"> 11 </tspan><tspan font-family="SimHei">个指数</tspan></text>
    <text x="64" y="785" font-size="25" fill="#262626" font-weight="400" text-anchor="start" font-family="SimSun"><tspan font-family="SimSun">收益回放与股债对照覆盖</tspan><tspan font-family="Times New Roman"> 5 </tspan><tspan font-family="SimSun">个指数</tspan></text>
    <text x="1210" y="740" font-size="23" fill="#262626" font-weight="400" text-anchor="start" font-family="SimSun"><tspan font-family="SimSun">工行渠道为拟落地场景</tspan></text>
    <text x="1210" y="780" font-size="23" fill="#262626" font-weight="400" text-anchor="start" font-family="SimSun"><tspan font-family="SimSun">桌面</tspan><tspan font-family="Times New Roman"> / </tspan><tspan font-family="SimSun">网页已实现</tspan></text>
  </g>
</svg>