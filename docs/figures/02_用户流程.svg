<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1200" viewBox="0 200 1600 800">
  <title>从看判断到带走报告，形成一次完整的决策流程</title>
  <desc>先读规则判断，再把自己的持仓放进来</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1,1 L8,5 L1,9" fill="none" stroke="#262626" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="1600" height="1000" fill="white"/>
  <g font-family="SimSun">
    <rect x="64" y="300" width="280" height="190" rx="4" fill="white" stroke="#262626" stroke-width="1.5"/>
    <text x="88" y="345" font-size="29" fill="#262626" font-weight="400" text-anchor="start" font-family="SimHei"><tspan font-family="Times New Roman">01 </tspan><tspan font-family="SimHei">打开经纬</tspan></text>
    <text x="88" y="391" font-size="23" fill="#262626" font-weight="400" text-anchor="start" font-family="SimSun"><tspan font-family="SimSun">进入今日判断</tspan></text>
    <rect x="414" y="300" width="490" height="190" rx="4" fill="white" stroke="#262626" stroke-width="1.5"/>
    <text x="438" y="345" font-size="29" fill="#262626" font-weight="400" text-anchor="start" font-family="SimHei"><tspan font-family="Times New Roman">02 </tspan><tspan font-family="SimHei">看今日判断</tspan></text>
    <text x="438" y="391" font-size="23" fill="#262626" font-weight="400" text-anchor="start" font-family="SimSun"><tspan font-family="SimSun">新增资金：是否追加</tspan></text>
    <text x="438" y="430" font-size="23" fill="#262626" font-weight="400" text-anchor="start" font-family="SimSun"><tspan font-family="SimSun">已有持仓：是否调整</tspan></text>
    <rect x="974" y="300" width="562" height="190" rx="4" fill="white" stroke="#262626" stroke-width="1.5"/>
    <text x="998" y="345" font-size="29" fill="#262626" font-weight="400" text-anchor="start" font-family="SimHei"><tspan font-family="Times New Roman">03 </tspan><tspan font-family="SimHei">截图导入持仓</tspan></text>
    <text x="998" y="391" font-size="23" fill="#262626" font-weight="400" text-anchor="start" font-family="SimSun"><tspan font-family="SimSun">识别基金名称与持仓金额</tspan></text>
    <text x="998" y="430" font-size="23" fill="#262626" font-weight="400" text-anchor="start" font-family="SimSun"><tspan font-family="SimSun">核对识别结果后导入</tspan></text>
    <path d="M354,395 L400,395" fill="none" stroke="#262626" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M914,395 L960,395" fill="none" stroke="#262626" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M1255,505 V555 H204 V605" fill="none" stroke="#262626" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="64" y="620" width="390" height="215" rx="4" fill="white" stroke="#262626" stroke-width="1.5"/>
    <text x="88" y="665" font-size="29" fill="#262626" font-weight="400" text-anchor="start" font-family="SimHei"><tspan font-family="Times New Roman">04 </tspan><tspan font-family="SimHei">查看持仓体检</tspan></text>
    <text x="88" y="711" font-size="23" fill="#262626" font-weight="400" text-anchor="start" font-family="SimSun"><tspan font-family="SimSun">覆盖：规则适用范围</tspan></text>
    <text x="88" y="750" font-size="23" fill="#262626" font-weight="400" text-anchor="start" font-family="SimSun"><tspan font-family="SimSun">区间：各指数估值位置</tspan></text>
    <text x="88" y="789" font-size="23" fill="#262626" font-weight="400" text-anchor="start" font-family="SimSun"><tspan font-family="SimSun">重复：同一指数重复持有</tspan></text>
    <rect x="524" y="620" width="390" height="215" rx="4" fill="white" stroke="#262626" stroke-width="1.5"/>
    <text x="548" y="665" font-size="29" fill="#262626" font-weight="400" text-anchor="start" font-family="SimHei"><tspan font-family="Times New Roman">05 </tspan><tspan font-family="SimHei">问经纬追问</tspan></text>
    <text x="548" y="711" font-size="23" fill="#262626" font-weight="400" text-anchor="start" font-family="SimSun"><tspan font-family="SimSun">围绕当前判断提问</tspan></text>
    <text x="548" y="750" font-size="23" fill="#262626" font-weight="400" text-anchor="start" font-family="SimSun"><tspan font-family="SimSun">结合规则证据解释</tspan></text>
    <rect x="984" y="620" width="552" height="215" rx="4" fill="white" stroke="#262626" stroke-width="1.5"/>
    <text x="1008" y="665" font-size="29" fill="#262626" font-weight="400" text-anchor="start" font-family="SimHei"><tspan font-family="Times New Roman">06 </tspan><tspan font-family="SimHei">带走结果</tspan></text>
    <text x="1008" y="711" font-size="23" fill="#262626" font-weight="400" text-anchor="start" font-family="SimSun"><tspan font-family="SimSun">导出持仓体检报告</tspan></text>
    <text x="1008" y="750" font-size="23" fill="#262626" font-weight="400" text-anchor="start" font-family="SimSun"><tspan font-family="SimSun">查看客户经理一页说明</tspan></text>
    <path d="M464,725 L510,725" fill="none" stroke="#262626" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M924,725 L970,725" fill="none" stroke="#262626" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M64,915 H1536" stroke="#262626" stroke-width="1.5"/>
    <text x="64" y="956" font-size="21" fill="#262626" font-weight="400" text-anchor="start" font-family="SimSun"><tspan font-family="SimSun">今日判断</tspan><tspan font-family="Times New Roman"> </tspan><tspan font-family="SimSun">→</tspan><tspan font-family="Times New Roman"> </tspan><tspan font-family="SimSun">持仓体检</tspan><tspan font-family="Times New Roman"> </tspan><tspan font-family="SimSun">→</tspan><tspan font-family="Times New Roman"> </tspan><tspan font-family="SimSun">追问解读</tspan><tspan font-family="Times New Roman"> </tspan><tspan font-family="SimSun">→</tspan><tspan font-family="Times New Roman"> </tspan><tspan font-family="SimSun">报告与客户经理说明。</tspan></text>
  </g>
</svg>