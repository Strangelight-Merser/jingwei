<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><title>从看判断到带走报告，形成一次完整的决策流程</title><desc>先读规则判断，再把自己的持仓放进来</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1,1 L8,5 L1,9" fill="none" stroke="#963749" stroke-width="1.5"/></marker></defs><rect width="1600" height="1000" fill="white"/><g font-family="PingFang SC, Songti SC, sans-serif"><text x="64" y="66" font-size="22" fill="#963749" font-weight="600" text-anchor="start">经纬 · 规则e判</text><text x="64" y="134" font-size="44" fill="#25252b" font-weight="600" text-anchor="start">从看判断到带走报告，形成一次完整的决策流程</text><text x="64" y="184" font-size="25" fill="#666670" font-weight="400" text-anchor="start">先读规则判断，再把自己的持仓放进来</text><rect x="64" y="300" width="280" height="190" rx="16" fill="white" stroke="#dedde2"/><text x="88" y="345" font-size="29" fill="#25252b" font-weight="600" text-anchor="start">01 打开经纬</text><text x="88" y="391" font-size="23" fill="#666670" font-weight="400" text-anchor="start">进入今日判断</text><rect x="414" y="300" width="490" height="190" rx="16" fill="white" stroke="#dedde2"/><text x="438" y="345" font-size="29" fill="#25252b" font-weight="600" text-anchor="start">02 看今日判断</text><text x="438" y="391" font-size="23" fill="#666670" font-weight="400" text-anchor="start">新增资金：是否追加</text><text x="438" y="430" font-size="23" fill="#666670" font-weight="400" text-anchor="start">已有持仓：是否调整</text><rect x="974" y="300" width="562" height="190" rx="16" fill="white" stroke="#dedde2"/><text x="998" y="345" font-size="29" fill="#25252b" font-weight="600" text-anchor="start">03 截图导入持仓</text><text x="998" y="391" font-size="23" fill="#666670" font-weight="400" text-anchor="start">识别基金名称与持仓金额</text><text x="998" y="430" font-size="23" fill="#666670" font-weight="400" text-anchor="start">核对识别结果后导入</text><path d="M354,395 L400,395" fill="none" stroke="#963749" stroke-width="3" marker-end="url(#arrow)"/><path d="M914,395 L960,395" fill="none" stroke="#963749" stroke-width="3" marker-end="url(#arrow)"/><path d="M1255,505 V555 H204 V605" fill="none" stroke="#963749" stroke-width="3" marker-end="url(#arrow)"/><rect x="64" y="620" width="390" height="215" rx="16" fill="white" stroke="#dedde2"/><text x="88" y="665" font-size="29" fill="#25252b" font-weight="600" text-anchor="start">04 查看持仓体检</text><text x="88" y="711" font-size="23" fill="#666670" font-weight="400" text-anchor="start">覆盖：规则适用范围</text><text x="88" y="750" font-size="23" fill="#666670" font-weight="400" text-anchor="start">区间：各指数估值位置</text><text x="88" y="789" font-size="23" fill="#666670" font-weight="400" text-anchor="start">重复：同一指数重复持有</text><rect x="524" y="620" width="390" height="215" rx="16" fill="white" stroke="#dedde2"/><text x="548" y="665" font-size="29" fill="#25252b" font-weight="600" text-anchor="start">05 问经纬追问</text><text x="548" y="711" font-size="23" fill="#666670" font-weight="400" text-anchor="start">围绕当前判断提问</text><text x="548" y="750" font-size="23" fill="#666670" font-weight="400" text-anchor="start">结合规则证据解释</text><rect x="984" y="620" width="552" height="215" rx="16" fill="white" stroke="#dedde2"/><text x="1008" y="665" font-size="29" fill="#25252b" font-weight="600" text-anchor="start">06 带走结果</text><text x="1008" y="711" font-size="23" fill="#666670" font-weight="400" text-anchor="start">导出持仓体检报告</text><text x="1008" y="750" font-size="23" fill="#666670" font-weight="400" text-anchor="start">查看客户经理一页说明</text><path d="M464,725 L510,725" fill="none" stroke="#963749" stroke-width="3" marker-end="url(#arrow)"/><path d="M924,725 L970,725" fill="none" stroke="#963749" stroke-width="3" marker-end="url(#arrow)"/><path d="M64,915 H1536" stroke="#dedde2"/><text x="64" y="956" font-size="21" fill="#666670" font-weight="400" text-anchor="start">今日判断 → 持仓体检 → 追问解读 → 报告与客户经理说明。</text></g></svg>